# ZOMVYRA for Mac.
# Whenever a release is published, this takes the Windows installer of that release (ZOMVYRA-Setup.exe), lifts the game out of it,
# wraps it as a Mac app and attaches two files to the same release:
#   ZOMVYRA-mac.zip        for Macs with Apple Silicon (M1 and later)
#   ZOMVYRA-mac-intel.zip  for older Macs with an Intel processor
# Nothing else has to be uploaded for the Mac: publish the Windows release as always and wait a few minutes.
# It runs on one of GitHub's Linux machines (their Mac machines were not to be had), so the Mac app is put together and signed there.
# By hand: Actions -> "Mac build" -> Run workflow (tag empty = the newest release).
name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v9.22.2 (empty = the newest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mac-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EV_TAG: ${{ github.event.release.tag_name }}
      IN_TAG: ${{ inputs.tag }}
      ELECTRON: "45.3.2"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Which release
        run: |
          TAG="$EV_TAG"; [ -z "$TAG" ] && TAG="$IN_TAG"
          [ -z "$TAG" ] && TAG="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "release: $TAG"

      - name: Fetch the Windows installer
        run: |
          # the installer may still be uploading when the release is published: wait for it (up to 30 minutes)
          for i in $(seq 1 60); do
            if gh release download "$TAG" --repo "$REPO" --pattern ZOMVYRA-Setup.exe --dir dl --clobber; then break; fi
            echo "not there yet ($i)"; sleep 30
          done
          test -s dl/ZOMVYRA-Setup.exe || { echo "::error::ZOMVYRA-Setup.exe is not attached to $TAG"; exit 1; }
          ls -l dl

      - name: Lift the game out of it
        run: |
          SZ="$(command -v 7zz || command -v 7z || true)"
          if [ -z "$SZ" ]; then sudo apt-get install -y -q p7zip-full; SZ="$(command -v 7z)"; fi
          "$SZ" x -y -bso0 -bsp0 dl/ZOMVYRA-Setup.exe -oinst
          PKG="$(find inst -name 'app-64.7z' | head -1)"; [ -z "$PKG" ] && PKG="$(find inst -name 'app-*.7z' | head -1)"
          [ -n "$PKG" ] || { echo "::error::no app package inside the installer"; find inst -maxdepth 3 | head -50; exit 1; }
          "$SZ" x -y -bso0 -bsp0 "$PKG" -owin
          if [ -d win/resources/app ]; then cp -R win/resources/app src
          elif [ -f win/resources/app.asar ]; then npx --yes @electron/asar@3 extract win/resources/app.asar src
          else echo "::error::no game inside the app package"; ls -la win win/resources; exit 1; fi
          test -f src/main.js && test -f src/package.json && test -f src/manifest.json && test -f src/game/index.html
          echo "VER=$(node -p "require('./src/package.json').version")" >> "$GITHUB_ENV"
          # every game file must be exactly what the Windows build shipped: the game checks the same at its start
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto"), man = require("./src/manifest.json").files;
            let n = 0; for(const rel in man){ const h = crypto.createHash("sha256").update(fs.readFileSync(path.join("src/game", rel))).digest("hex"); if(h !== man[rel]){ console.error("changed: " + rel); process.exit(1); } n++; }
            console.log(n + " game files intact");'

      - name: Icon
        run: |
          # the Windows icon, enlarged into the sizes a Mac wants; without it the app still builds, with a plain icon
          set +e
          python3 -m pip install --quiet --disable-pip-version-check pillow
          python3 -c "from PIL import Image; im = Image.open('src/icon.ico').convert('RGBA').resize((1024, 1024), Image.LANCZOS); im.save('icon.icns')"
          [ -s icon.icns ] && ls -l icon.icns || echo "::warning::no Mac icon could be made from icon.ico"
          exit 0

      - name: Signing tool
        run: |
          # no Apple account: the app signs itself ("ad hoc"). Without any signature a Mac with Apple Silicon refuses to start it at all.
          URL="$(gh api repos/indygreg/apple-platform-rs/releases --paginate -q '.[].assets[].browser_download_url' | grep -E 'apple-codesign-[0-9.]+-x86_64-unknown-linux-musl\.tar\.gz$' | head -1 || true)"
          echo "signing tool: $URL"
          RC=""
          if [ -n "$URL" ]; then mkdir rc; curl -sL "$URL" | tar xz -C rc; RC="$(find "$PWD/rc" -name rcodesign -type f | head -1)"; fi
          if [ -z "$RC" ]; then cargo install apple-codesign --locked; RC="$(command -v rcodesign)"; fi
          "$RC" --version
          echo "RC=$RC" >> "$GITHUB_ENV"

      - name: Wrap it as a Mac app
        run: |
          ICON=""; [ -s icon.icns ] && ICON="--icon=icon.icns"
          for A in arm64 x64; do
            npx --yes @electron/packager@18 src ZOMVYRA --platform=darwin --arch="$A" --electron-version="$ELECTRON" --out=out --overwrite --no-prune \
              --app-bundle-id=com.ender.zomvyra --app-version="$VER" --build-version="$VER" --app-category-type=public.app-category.action-games $ICON
            APP="out/ZOMVYRA-darwin-$A/ZOMVYRA.app"
            test -x "$APP/Contents/MacOS/ZOMVYRA" && test -f "$APP/Contents/Resources/app/main.js"
            "$RC" sign "$APP" 2>&1 | tail -15
            "$RC" print-signature-info "$APP/Contents/MacOS/ZOMVYRA" 2>&1 | head -30 || true
            NAME="ZOMVYRA-mac.zip"; [ "$A" = x64 ] && NAME="ZOMVYRA-mac-intel.zip"
            (cd "out/ZOMVYRA-darwin-$A" && zip -qry "$GITHUB_WORKSPACE/$NAME" ZOMVYRA.app)
            du -sh "$APP"; ls -l "$NAME"
          done

      - name: Attach them to the release
        run: gh release upload "$TAG" ZOMVYRA-mac.zip ZOMVYRA-mac-intel.zip --repo "$REPO" --clobber
