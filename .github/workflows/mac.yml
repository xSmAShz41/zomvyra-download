# ZOMVYRA for Mac.
# Whenever a release is published, this takes the Windows installer of that release (ZOMVYRA-Setup.exe), lifts the game out of it,
# wraps it as a Mac app for both kinds of Mac (Apple Silicon and Intel in one), and attaches ZOMVYRA-mac.dmg to the same release.
# Nothing else has to be uploaded for the Mac: publish the Windows release as always and wait a few minutes.
# By hand: Actions -> "Mac build" -> Run workflow (tag empty = the newest release).
name: Mac build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v9.22.2 (empty = the newest release)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: mac-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EV_TAG: ${{ github.event.release.tag_name }}
      IN_TAG: ${{ inputs.tag }}
      ELECTRON: "45.3.2"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Which release
        run: |
          TAG="$EV_TAG"; [ -z "$TAG" ] && TAG="$IN_TAG"
          [ -z "$TAG" ] && TAG="$(gh release view --repo "$REPO" --json tagName -q .tagName)"
          case "$TAG" in v[0-9]*) ;; *) echo "::error::not a release tag: $TAG"; exit 1;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "release: $TAG"

      - name: Fetch the Windows installer
        run: |
          # the installer may still be uploading when the release is published: wait for it (up to 30 minutes)
          for i in $(seq 1 60); do
            if gh release download "$TAG" --repo "$REPO" --pattern ZOMVYRA-Setup.exe --dir dl --clobber; then break; fi
            echo "not there yet ($i)"; sleep 30
          done
          test -s dl/ZOMVYRA-Setup.exe || { echo "::error::ZOMVYRA-Setup.exe is not attached to $TAG"; exit 1; }
          ls -l dl

      - name: Lift the game out of it
        run: |
          SZ="$(command -v 7zz || command -v 7z || true)"
          if [ -z "$SZ" ]; then brew install sevenzip; SZ="$(command -v 7zz)"; fi
          "$SZ" x -y -bso0 -bsp0 dl/ZOMVYRA-Setup.exe -oinst
          PKG="$(find inst -name 'app-64.7z' | head -1)"; [ -z "$PKG" ] && PKG="$(find inst -name 'app-*.7z' | head -1)"
          [ -n "$PKG" ] || { echo "::error::no app package inside the installer"; find inst -maxdepth 3 | head -50; exit 1; }
          "$SZ" x -y -bso0 -bsp0 "$PKG" -owin
          if [ -d win/resources/app ]; then cp -R win/resources/app src
          elif [ -f win/resources/app.asar ]; then npx --yes @electron/asar@3 extract win/resources/app.asar src
          else echo "::error::no game inside the app package"; ls -la win win/resources; exit 1; fi
          test -f src/main.js && test -f src/package.json && test -f src/manifest.json && test -f src/game/index.html
          echo "VER=$(node -p "require('./src/package.json').version")" >> "$GITHUB_ENV"
          # every game file must be exactly what the Windows build shipped: the game checks the same at its start
          node -e '
            const fs = require("fs"), path = require("path"), crypto = require("crypto"), man = require("./src/manifest.json").files;
            let n = 0; for(const rel in man){ const h = crypto.createHash("sha256").update(fs.readFileSync(path.join("src/game", rel))).digest("hex"); if(h !== man[rel]){ console.error("changed: " + rel); process.exit(1); } n++; }
            console.log(n + " game files intact");'

      - name: Icon
        run: |
          # the Windows icon, enlarged into the sizes a Mac wants; without it the app still builds, with a plain icon
          set +e
          sips -s format png src/icon.ico --out base.png >/dev/null 2>&1
          if [ -s base.png ]; then
            mkdir icon.iconset
            for s in 16 32 128 256 512; do
              sips -z $s $s base.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
              d=$((s*2)); sips -z $d $d base.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns icon.iconset -o icon.icns
          fi
          [ -s icon.icns ] && echo "icon ok" || echo "::warning::no Mac icon could be made from icon.ico"
          exit 0

      - name: Wrap it as a Mac app
        run: |
          ICON=""; [ -s icon.icns ] && ICON="--icon=icon.icns"
          pack(){ npx --yes @electron/packager@18 src ZOMVYRA --platform=darwin --arch="$1" --electron-version="$ELECTRON" --out=out --overwrite --no-prune \
            --app-bundle-id=com.ender.zomvyra --app-version="$VER" --build-version="$VER" --app-category-type=public.app-category.action-games $ICON; }
          if ! pack universal; then echo "::warning::the build for both kinds of Mac failed; building for Apple Silicon only"; rm -rf out; pack arm64; fi
          APP="$(find out -maxdepth 2 -name 'ZOMVYRA.app' | head -1)"; test -d "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"
          # no Apple account: the app signs itself. Without any signature a Mac with Apple Silicon refuses to start it at all.
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/ZOMVYRA" || true
          du -sh "$APP"

      - name: Start it once
        run: |
          # does it come up and stay up? (a look only: a failed look is reported, it does not stop the build)
          set +e
          "$APP/Contents/MacOS/ZOMVYRA" --user-data-dir="$RUNNER_TEMP/zv-data" > run.log 2>&1 &
          PID=$!; sleep 30
          screencapture -x shot.png 2>/dev/null
          if kill -0 $PID 2>/dev/null; then echo "the game is running"; kill $PID; else echo "::warning::the game did not stay open on the build machine"; fi
          tail -40 run.log
          exit 0

      - name: Disk image
        run: |
          mkdir dmg; ditto "$APP" dmg/ZOMVYRA.app; ln -s /Applications dmg/Applications
          for i in 1 2 3 4; do
            hdiutil create -volname "ZOMVYRA" -srcfolder dmg -ov -format UDZO -fs HFS+ ZOMVYRA-mac.dmg && break
            sleep 15
          done
          test -s ZOMVYRA-mac.dmg; ls -l ZOMVYRA-mac.dmg

      - name: Attach it to the release
        run: gh release upload "$TAG" ZOMVYRA-mac.dmg --repo "$REPO" --clobber

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-start
          path: |
            shot.png
            run.log
          if-no-files-found: ignore
          retention-days: 14
